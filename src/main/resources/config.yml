# ========= CONFIGURATIONS =========
# check GitHub for a newer release when the server starts.
check-updates: true

# allow tpa to yourself, use in development.
allow-tpa-to-yourself: false

# TPA request expiry time (in seconds)
tpa-expiry: 180

tpa:
  def-cost: 10.0

tpahere:
  def-cost: 10.0

# sound after receiving teleportation request
enable-sound-tpa: true
# Use the Minecraft sound key (dots, not underscores), e.g. entity.experience_orb.pickup
sound-tpa: "entity.experience_orb.pickup"